<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta GC Bot - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #fff; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .form-control { background-color: #2a2a2a; border: 1px solid #444; color: white; }
        .form-control:focus { background-color: #2a2a2a; color: white; border-color: #e1306c; box-shadow: none; }
        .btn-insta { background-color: #e1306c; color: white; font-weight: bold; }
        .btn-insta:hover { background-color: #c12b5b; color: white; }
        .btn-stop { background-color: #f44336; color: white; font-weight: bold; }
        .status-dot { height: 12px; width: 12px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .dot-green { background-color: #4caf50; }
        .dot-red { background-color: #f44336; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4" style="color:#e1306c;">📸 Insta GC Bot Panel</h3>
                        
                        <div class="text-center mb-4">
                            <h5>Status: 
                                {% if running %}
                                    <span class="status-dot dot-green"></span> <span class="text-success">RUNNING</span>
                                {% else %}
                                    <span class="status-dot dot-red"></span> <span class="text-danger">STOPPED</span>
                                {% endif %}
                            </h5>
                        </div>

                        {% if running %}
                            <div class="alert alert-success">Bot is live and monitoring the group!</div>
                            <form action="/stop" method="post">
                                <button type="submit" class="btn btn-stop w-100 py-2">STOP BOT</button>
                            </form>
                        {% else %}
                            <form action="/start" method="post">
                                <div class="mb-3">
                                    <label class="form-label">Session ID (Cookies)</label>
                                    <input type="password" class="form-control" name="session_id" required placeholder="Enter sessionid...">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Group Thread ID</label>
                                    <input type="text" class="form-control" name="group_id" required placeholder="e.g. 1234567890">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Admins (Max 3, comma separated)</label>
                                    <input type="text" class="form-control" name="admins" required placeholder="@admin1, @admin2">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Proxy (Optional - Use if IP is blocked)</label>
                                    <input type="text" class="form-control" name="proxy" placeholder="http://ip:port or http://user:pass@ip:port">
                                </div>
                                <button type="submit" class="btn btn-insta w-100 py-2">START BOT</button>
                            </form>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
